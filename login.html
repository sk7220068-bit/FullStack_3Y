<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login & Contact - AI Fashion Recommender</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <a href="index.html" class="logo">Shivam Kumar</a>
    <nav>
      <a href="index.html">Home & About</a>
      <a href="projects.html">Featured Project</a>
      <a href="login.html" class="active">Login & Contact</a>
    </nav>
  </header>

  <!-- Main Content Area -->
  <main class="container">
    
    <!-- Login Card -->
    <div class="card">
      <h2>System Portal Login</h2>
      <p style="margin-bottom: 1.25rem;">Access the AI Fashion Recommender admin dashboard & model metrics.</p>
      <form action="#" method="post">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" name="email" placeholder="admin@fashionai.com" required />
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="Enter your password" required />
        </div>

        <button type="submit">Login to Dashboard</button>
      </form>
    </div>

    <!-- Contact Form Card -->
    <div class="card">
      <h2>Contact & API Inquiries</h2>
      <p style="margin-bottom: 1.25rem;">Have questions about the YOLOv8 + ResNet50 model integration or Spring Boot API?</p>
      <form action="#" method="post">
        <div class="form-group">
          <label for="contact-name">Your Name</label>
          <input type="text" id="contact-name" name="name" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label for="contact-email">Your Email</label>
          <input type="email" id="contact-email" name="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label for="contact-message">Message / Inquiry</label>
          <textarea id="contact-message" name="message" rows="4" placeholder="Ask about dataset integration, model fine-tuning, or API access..." required></textarea>
        </div>

        <button type="submit">Send Message</button>
      </form>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    &copy; 2026 Shivam Kumar. All rights reserved.
  </footer>

</body>
</html>
