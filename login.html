<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login & Contact - Shivam Kumar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <a href="index.html" class="logo">Shivam Kumar</a>
    <nav>
      <a href="index.html">Home & About</a>
      <a href="projects.html">Featured Project</a>
      <a href="login.html" class="active">Login & Contact</a>
    </nav>
  </header>

  <!-- Main Content Area -->
  <main class="container">
    
    <!-- Login Card -->
    <div class="card">
      <h2>Login Account</h2>
      <form action="#" method="post">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" name="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="Enter your password" required />
        </div>

        <button type="submit">Login</button>
      </form>
    </div>

    <!-- Contact Form Card -->
    <div class="card">
      <h2>Contact Me</h2>
      <form action="#" method="post">
        <div class="form-group">
          <label for="contact-name">Your Name</label>
          <input type="text" id="contact-name" name="name" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label for="contact-email">Your Email</label>
          <input type="email" id="contact-email" name="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" rows="4" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit">Send Message</button>
      </form>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    &copy; 2026 Shivam Kumar. All rights reserved.
  </footer>

</body>
</html>
